<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self'; connect-src 'none'">
  <title>选择共享内容</title>
  <link rel="stylesheet" href="picker.css">
</head>
<body>
  <header><div><small>iruler dream</small><h1>选择你要共享的内容</h1></div><button id="cancel">取消</button></header>
  <p>仅共享选中的窗口或屏幕。麦克风由通话按钮单独控制；本次不会采集系统声音。</p>
  <main id="sources" aria-label="可共享的屏幕和窗口"><p>正在查找窗口…</p></main>
  <footer>选择后立即开始共享；可在办公室中点击“停止共享”结束。</footer>
  <script src="picker.js"></script>
</body>
</html>
