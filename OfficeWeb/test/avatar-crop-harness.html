<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<title>头像裁切试验</title>
<style>
  body { margin: 0; background: #202020; color: #ddd; font: 12px/1.4 "Microsoft YaHei", sans-serif; }
  .row { display: flex; align-items: center; gap: 10px; padding: 8px 12px; }
  .label { width: 210px; opacity: .8; }
  .avatar {
    width: 30px; height: 30px; border-radius: 6px;
    background-repeat: no-repeat;
    border: 1px solid rgba(255,255,255,.15);
  }
  .full { width: 30px; height: 30px; border-radius: 6px; object-fit: cover; }
</style></head>
<body>
<div id="root"></div>
<script type="module">
  const thumbs = ['man_suit', 'woman_casual', 'man_worker'];
  const variants = [
    ['原图整张 cover', null],
    ['size 250% pos 50% 6%', '250% auto,50% 6%'],
    ['size 250% pos 50% 10%', '250% auto,50% 10%'],
    ['size 300% pos 50% 8%', '300% auto,50% 8%'],
    ['size 300% pos 50% 12%', '300% auto,50% 12%'],
    ['size 350% pos 50% 10%', '350% auto,50% 10%'],
    ['size 400% pos 50% 9%', '400% auto,50% 9%'],
  ];
  const root = document.getElementById('root');
  for (const [label, spec] of variants) {
    const row = document.createElement('div');
    row.className = 'row';
    const name = document.createElement('div');
    name.className = 'label';
    name.textContent = label;
    row.append(name);
    for (const id of thumbs) {
      const url = `/assets/characters/thumbnails/${id}.png`;
      const node = document.createElement('div');
      node.className = 'avatar';
      node.style.backgroundImage = `url(${url})`;
      if (spec) {
        const [size, position] = spec.split(',');
        node.style.backgroundSize = size;
        node.style.backgroundPosition = position;
      } else {
        node.style.backgroundSize = '100% 100%';
      }
      node.title = id;
      row.append(node);
    }
    root.append(row);
  }
  window.__ready = true;
</script>
</body></html>
