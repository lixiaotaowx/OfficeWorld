<!doctype html><html><meta charset="utf-8"><body><div id="root"></div><script type="module">
import React from 'react';import {createRoot} from 'react-dom/client';
import {useOffice} from '/src/useOffice.ts';import PrivateCallPanel from '/src/PrivateCallPanel.tsx';
const user=(await (await fetch('/api/auth/me')).json()).user;
function Harness(){const office=useOffice(user);window.office=office;return React.createElement(PrivateCallPanel,{office});}
createRoot(document.getElementById('root')).render(React.createElement(Harness));
</script></body></html>
