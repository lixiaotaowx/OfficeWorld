<!doctype html><html lang="zh-CN"><meta charset="utf-8"><body><div id="root"></div>
<script>
// ?desktop=1 mimics the Electron bridge: whole-screen mode is a native window call
// that reports back through an event, because the DOM API does nothing there.
if (new URLSearchParams(location.search).has('desktop')) {
  const listeners = new Set();
  window.__calls = [];
  window.officeDesktop = {
    setFullscreen(value) { window.__calls.push(value); listeners.forEach((fn) => fn(value)); return Promise.resolve(value); },
    onFullscreenChange(callback) { listeners.add(callback); return () => listeners.delete(callback); },
  };
}
</script>
<script type="module">
import React from 'react'; import {createRoot} from 'react-dom/client';
import ScreenStage from '/src/ScreenStage.tsx';
import '/src/styles.css'; import '/src/workspace-ui.css'; import '/src/screen-stage.css';
// Synthetic "shared screen": a canvas capture, no real desktop involved.
const canvas=document.createElement('canvas'); canvas.width=1280; canvas.height=720;
const ctx=canvas.getContext('2d');
ctx.fillStyle='#20406a'; ctx.fillRect(0,0,1280,720);
ctx.fillStyle='#fff'; ctx.font='48px sans-serif'; ctx.fillText('SHARED SCREEN',80,140);
const stream=canvas.captureStream(5);
// What the stage asked the relay to send, so a test can check the mapped points.
window.__drawn=[];
// ?readonly=1 is a sharer that cannot host the annotation layer (a browser tab).
const sharerHasLayer = !new URLSearchParams(location.search).has('readonly');
// ?own=1 是"分享者自己那块预览"：只有清屏入口，没有整套标注工具（用户 2026-10-14）。
const ownBoard = new URLSearchParams(location.search).has('own');
const root=createRoot(document.getElementById('root'));
root.render(React.createElement(ScreenStage,{
  stream, scope:'call-harness', label:'对方共享屏幕', selfColor:'hsl(120 74% 46%)',
  annotatable: sharerHasLayer,
  clearsOwnBoard: ownBoard,
  onDraw:(scope,points,done,color)=>window.__drawn.push({scope,points,done,color}),
  onClear:()=>{ window.__cleared=(window.__cleared||0)+1; }, onUndo:()=>{ window.__undone=(window.__undone||0)+1; },
  hint:'可点「标注」在画面上画线，所有人都能看到',
  actions:React.createElement(React.Fragment,null,
    React.createElement('button',{type:'button'},'静音我'),
    React.createElement('button',{type:'button'},'静音对方'),
    React.createElement('button',{type:'button'},'抢占共享'),
    React.createElement('button',{type:'button',className:'call-hangup'},'挂断')),
}));
// Hanging up removes the stage from the app; the test does the same here.
window.__unmountStage=()=>root.unmount();
window.__stageReady=true;
</script></body></html>
