<!doctype html><html><head><meta charset="utf-8"><title>Arrow glow QA</title></head>
<body style="margin:0"><script type="module">
// 流动箭头的呼吸发光：用与办公室一致的渲染设置（AgX + 同样的曝光）量真实像素。
import * as THREE from 'three';
import { createPart } from '../src/buildMeshes';
import { updateBuildFlags } from '../src/buildArchitecture';
const world = new THREE.Scene();
world.background = new THREE.Color('#c7d8ee');
world.add(new THREE.AmbientLight('white', 1));
const sun = new THREE.DirectionalLight('white', 2.2);
sun.position.set(4, 8, 6);
world.add(sun);
const renderer = new THREE.WebGLRenderer({preserveDrawingBuffer:true});
renderer.setSize(640,480);
renderer.toneMapping = THREE.AgXToneMapping;
renderer.toneMappingExposure = 1.11;
document.body.append(renderer.domElement);
const camera = new THREE.PerspectiveCamera(40,4/3,.1,100);
camera.position.set(2.6,2.4,3.4);
camera.lookAt(0,.6,0);
camera.updateMatrixWorld(true);
// 深色背板：加法混合的光晕在这上面不会被天空的高亮顶到饱和，量程才干净。
const backdrop = new THREE.Mesh(new THREE.PlaneGeometry(9,7), new THREE.MeshStandardMaterial({color:'#39413f',roughness:1}));
backdrop.position.set(0,1.4,-1.5);
backdrop.lookAt(camera.position);
world.add(backdrop);
const arrowRoot = createPart({id:'arrow',kind:'flow-arrow',color:'#e9b8b5',x:0,y:0.4,z:0,rotation:1,version:1});
world.add(arrowRoot);
// 本体网格（光晕壳是它的子节点）：量光晕时要用本体自己的包围盒当基准。
const arrow = arrowRoot.userData.arrowPanels[0];
function render(time = 0){ updateBuildFlags(world,time); renderer.render(world,camera); }
// 暂停的动画循环：由测试自己按相位调 render(t)，读到的就是那一刻的像素。
window.qa = {world,renderer,camera,arrow,arrowRoot,THREE,createPart,updateBuildFlags,render};
</script></body></html>
