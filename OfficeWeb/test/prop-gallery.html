<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>休闲空间物品库</title>
<style>
  body{margin:0;padding:32px;background:#f3efe8;color:#43504b;font:14px system-ui,sans-serif}
  h1{margin:0;font-size:28px}p{color:#7e8076;margin:10px 0 24px}
  #gallery{display:grid;grid-template-columns:repeat(7,1fr);gap:12px}
  article{background:#fffaf2;border:1px solid #e5dfd5;border-radius:12px;text-align:center;padding:8px}
  article img{width:100%;height:142px;object-fit:contain}strong{display:block;font-size:14px}
  small{display:block;color:#8a8b7d;font-size:10px;margin:5px 0}
</style>
<h1>一起放松 · 42 件新物品</h1><p>可独立摆放 / 7 色可选 / 方块造型 / 与 Blender 可编辑源一致</p>
<div id="gallery"></div>
<script type="module">
import * as THREE from 'three';
import {createPart} from '../src/buildMeshes';
import {catalog} from '../src/buildTypes';
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setSize(360,250);
renderer.setPixelRatio(1);
const scene=new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff,0xb0a9ba,2.2));
const key=new THREE.DirectionalLight(0xffead7,2.5);
key.position.set(-3,5,4);scene.add(key);
const camera=new THREE.OrthographicCamera(-1,1,1,-1,.01,50);
const tones={家具:'#e9b8b5',软装:'#cabddd',影音:'#f3dfc5',桌面:'#e9b8b5',自然:'#c69770',灯具:'#b4c5a0',建筑:'#e9b8b5'};
window.__models=[];
for(const item of catalog.slice(20)){
 const group=createPart({id:item.id,kind:item.id,color:tones[item.category],x:0,y:0,z:0,rotation:0});
 scene.add(group);
 const bounds=new THREE.Box3().setFromObject(group),center=bounds.getCenter(new THREE.Vector3());
 const size=bounds.getSize(new THREE.Vector3()),extent=Math.max(...size.toArray())*.85;
 camera.left=-extent;camera.right=extent;camera.top=extent/1.44;camera.bottom=-extent/1.44;
 camera.position.copy(center).add(new THREE.Vector3(4,3.2,5));camera.lookAt(center);camera.updateProjectionMatrix();
 renderer.render(scene,camera);
 const card=document.createElement('article');
 const img=document.createElement('img');img.src=renderer.domElement.toDataURL();
 const title=document.createElement('strong');title.textContent=item.label;
 const note=document.createElement('small');note.textContent=item.category+' · '+item.size.join(' × ')+' m';
 card.append(img,title,note);document.querySelector('#gallery').append(card);
 window.__models.push({id:item.id,meshes:group.children.length,size:size.toArray()});
 scene.remove(group);
}
renderer.dispose();renderer.forceContextLoss();window.__ready=true;
</script></html>
