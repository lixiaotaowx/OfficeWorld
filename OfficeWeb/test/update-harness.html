<!doctype html><html lang="zh-CN"><meta charset="utf-8"><body><div id="root"></div>
<script type="module">
// Harness for the update prompt: builds the copy with the real `describeUpdate` (so the
// test exercises the same wording the app ships) and renders it stage by stage.
import React from 'react'; import { createRoot } from 'react-dom/client';
import UpdatePrompt from '/src/UpdatePrompt.tsx';
import { describeUpdate } from '/src/updateRules.ts';
import '/src/styles.css'; import '/src/workspace-ui.css'; import '/src/update.css';

const params = new URLSearchParams(location.search);
const stage = params.get('stage') || 'available';
const old = params.get('old') === '1';           // no appVersion(): 0.1.13 and older
const manifest = {
  version: '0.1.14', file: 'iruler-dream-Setup-0.1.14-x64.exe',
  url: '/download/iruler-dream-Setup-0.1.14-x64.exe', size: 101_200_000,
  sha256: 'a'.repeat(64), notes: '修好了离座检测',
};
window.__started = 0; window.__installed = 0; window.__later = 0;
window.__revealed = 0; window.__copied = 0;
createRoot(document.getElementById('root')).render(React.createElement(UpdatePrompt, {
  update: {
    stage,
    copy: describeUpdate(manifest, old ? undefined : '0.1.13', stage),
    percent: stage === 'downloading' ? 42.5 : null,
    received: stage === 'downloading' ? 43_000_000 : 0,
    total: 101_200_000,
    error: undefined,
    autoInstall: stage === 'ready',
    start: async () => { window.__started += 1; },
    install: async () => { window.__installed += 1; },
    reveal: async () => { window.__revealed += 1; },
    copyLink: async () => { window.__copied += 1; },
    later: () => { window.__later += 1; },
  },
}));
window.__updateReady = true;
</script></body></html>
